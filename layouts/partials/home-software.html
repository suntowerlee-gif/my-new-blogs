{{/* Home page: showcase of the pages under /software/ as cards. Used by the recent-articles override. */}}
{{ with site.GetPage "/software" }}
  {{ with .Pages.ByWeight }}
    <h2 class="mt-8 text-2xl font-extrabold mb-10">我的软件</h2>
    <section class="w-full grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {{ range . }}
        {{ partial "article-link/card.html" . }}
      {{ end }}
    </section>
    <div class="mt-10 mb-4 flex justify-center">
      <a href="{{ "/software/" | relLangURL }}">
        <button
          class="bg-transparent hover:text-primary-500 prose dark:prose-invert font-semibold py-2 px-4 border border-primary-500 hover:border-transparent rounded">
          查看全部软件
        </button>
      </a>
    </div>
  {{ end }}
{{ end }}
